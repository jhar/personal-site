name: Deploy

# Merges to master deploy to staging, then to production once approved
# (approval comes from the "production" environment's required reviewers).
# Run manually to deploy any branch to staging, or master to production.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            out/
            api/dist/lambda.zip
          if-no-files-found: error

  staging:
    needs: build
    if: github.event_name == 'push' || inputs.environment == 'staging'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
    permissions:
      contents: read
      id-token: write

  production:
    needs: [build, staging]
    if: >-
      always() && needs.build.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' && needs.staging.result == 'success' ||
       github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
    permissions:
      contents: read
      id-token: write
