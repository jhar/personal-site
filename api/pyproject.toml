[project]
name = "site-api"
version = "0.1.0"
description = "Lambda behind /api/* for the personal site"
requires-python = ">=3.13,<3.14"
# Runtime dependencies: none. boto3 ships with the python3.13 Lambda runtime.
dependencies = []

[dependency-groups]
dev = [
  "boto3>=1.40",
  "pytest>=8",
  "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
