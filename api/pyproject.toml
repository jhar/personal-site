[project]
name = "site-api"
version = "0.1.0"
description = "Python Worker behind /api/* for the personal site"
requires-python = ">=3.13,<3.14"
# Runtime dependencies: none. The Worker uses only the standard library and the
# Workers SDK (`workers`), which the runtime provides.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
